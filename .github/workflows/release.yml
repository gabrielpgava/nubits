name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux x64 headless
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^VERSION = //p' nu.pro)"
          test "$version" = "$project_version"
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libboost-filesystem-dev \
            libboost-program-options-dev \
            libboost-thread-dev \
            libboost-chrono-dev \
            libboost-test-dev \
            libdb5.3++-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            ca-certificates \
            patchelf

      - name: Build and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          make -C src -f makefile.unix -j2 BDB_LIB_SUFFIX=-5.3 test_nu
          ./src/test_nu --report_level=short
          make -C src -f makefile.unix -j2 BDB_LIB_SUFFIX=-5.3 nud
          mkdir -p "$RUNNER_TEMP/nubits-smoke"
          ./src/nud -datadir="$RUNNER_TEMP/nubits-smoke" --help >/dev/null

      - name: Package Linux server
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash tools/package_linux.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/Nu-*-linux-x64-server.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Windows x64 GUI and headless
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-db
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-ca-certificates

      - name: Verify tag and build binaries
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^VERSION = //p' nu.pro)"
          test "$version" = "$project_version"
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
          make -C src -f makefile.mingw -j2
          qmake-qt5 nu.pro "RELEASE=1" "USE_UPNP=-"
          make -j2
          test -s release/nu.exe
          test -s src/nud.exe

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Package Windows runtimes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & "$env:GITHUB_WORKSPACE\tools\package_windows.ps1" -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          Push-Location "$env:GITHUB_WORKSPACE\share"
          & 'C:\Program Files (x86)\NSIS\makensis.exe' "/DVERSION=$version" `
            'setup.nsi'
          $makensisExitCode = $LASTEXITCODE
          Pop-Location
          if ($makensisExitCode -ne 0) { throw 'NSIS failed to build the GUI installer' }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\dist\Nu-$version-windows-x64-setup.exe")) {
            throw 'Expected Windows GUI installer was not created'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Nu-*-windows-x64-runtime.zip
            dist/Nu-*-windows-x64-server.zip
            dist/Nu-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum Nu-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: NuBits ${{ github.ref_name }} Beta
          prerelease: true
          body: |
            ## NuBits ${{ github.ref_name }} Beta

            ### Downloads
            - **Windows GUI:** `*-windows-x64-setup.exe`
            - **Windows auto-update runtime:** `*-windows-x64-runtime.zip`
            - **Windows headless server:** `*-windows-x64-server.zip`
            - **Linux x64 headless server:** `*-linux-x64-server.tar.gz`

            `SHA256SUMS` contains SHA-256 checksums for every download. Windows
            and Linux auto-updates use the runtime archives and verify the
            digest published by GitHub before installing.
          files: |
            dist/Nu-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
